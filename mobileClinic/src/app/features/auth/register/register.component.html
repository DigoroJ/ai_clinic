<div class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">
      <span class="material-icons">local_hospital</span>
    </div>

    <h1>Create your account</h1>
    <p class="auth-subtitle">Register as a patient</p>

    <div class="auth-message error" *ngIf="errorMessage" role="alert">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="submit()" novalidate>

      <div class="row">
        <div>
          <label for="firstName">First name</label>
          <input id="firstName" name="firstName" autocomplete="given-name"
                 [(ngModel)]="firstName" [disabled]="loading" />
        </div>

        <div>
          <label for="lastName">Last name</label>
          <input id="lastName" name="lastName" autocomplete="family-name"
                 [(ngModel)]="lastName" [disabled]="loading" />
        </div>
      </div>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email"
             placeholder="you@example.com"
             [(ngModel)]="email" [disabled]="loading" />

      <label for="phone">Phone (optional)</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel"
             [(ngModel)]="phone" [disabled]="loading" />

      <label for="password">Password (min. 8 characters)</label>
      <div class="password-field">
        <input id="password" name="password" autocomplete="new-password"
               [type]="showPassword ? 'text' : 'password'"
               [(ngModel)]="password" [disabled]="loading" />

        <button type="button" class="toggle-password"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                (click)="showPassword = !showPassword">
          <span class="material-icons">
            {{ showPassword ? 'visibility_off' : 'visibility' }}
          </span>
        </button>
      </div>

      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" name="confirmPassword" autocomplete="new-password"
             [type]="showPassword ? 'text' : 'password'"
             [(ngModel)]="confirmPassword" [disabled]="loading" />

      <button type="submit" class="primary-button" [disabled]="loading">
        {{ loading ? 'Creating account...' : 'Create account' }}
      </button>

    </form>

    <p class="auth-footer">
      Already registered?
      <a routerLink="/login">Log in</a>
    </p>

  </div>

</div>
