<div class="patient-page">
  <main class="patient-content">

    <button type="button" class="back-button" (click)="goBack()">
      <span class="material-icons">arrow_back</span>
      Back
    </button>

    <h1>My records</h1>
    <p class="muted">Notes from your visits with the clinic's doctors.</p>

    <div class="message error" *ngIf="error" role="alert">{{ error }}</div>

    <p class="muted" *ngIf="loading">Loading...</p>

    <p class="muted" *ngIf="!loading && !error && records.length === 0">
      You have no medical records yet.
    </p>

    <article class="record-card" *ngFor="let r of records">

      <h3>{{ r.diagnosis }}</h3>

      <span class="muted">
        {{ dayLabel(r.visit_date) }} · {{ r.doctor }}
      </span>

      <p *ngIf="r.treatment"><strong>Treatment:</strong> {{ r.treatment }}</p>
      <p *ngIf="r.notes"><strong>Notes:</strong> {{ r.notes }}</p>

    </article>

  </main>
</div>
